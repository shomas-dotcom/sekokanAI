# Render Blueprint(このファイルをリポジトリに置いた状態でRenderの
# 「New +」→「Blueprint」からこのリポジトリを選ぶと、下記の設定でサービスが
# 作成される。値が空の環境変数はRenderのダッシュボード側で入力する
# (sync: false = 値をこのファイルに書かず、画面から手入力する項目)。
services:
  - type: web
    name: genba-ai
    runtime: node
    plan: free
    # NODE_ENV=production だと npm install が devDependencies(prisma CLI含む)を
    # 省略してしまうため --include=dev が必須(DEPLOYMENT.mdのトラブル対応履歴参照)
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # 本番用Postgresの接続文字列(Neon/Supabase等)
      - key: AUTH_SECRET
        generateValue: true # Renderにランダムな値を自動生成させる
      - key: APP_URL
        sync: false # 例: https://genba-ai.onrender.com、独自ドメイン設定後はそちらに変更
      - key: AI_API_KEY
        sync: false # 未設定ならAI機能はモック応答のまま動作する
      - key: AI_API_PROVIDER
        value: anthropic
      - key: TRANSCRIPTION_API_KEY
        sync: false # 未設定なら音声入力の録音フォールバックは「文字起こし利用不可」の案内のみで動作する
      - key: GOOGLE_CLIENT_ID
        sync: false # 未設定なら「Googleでログイン/登録」ボタンが非表示になるだけ
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false # 未設定ならメール送信はログ出力のみのモックで動作する
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false # 未設定なら決済は開発用の疑似トライアルのまま動作する
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false # 運営管理画面(/admin)アカウント。デプロイ後に別途 npm run db:seed-admin を実行
      - key: ADMIN_PASSWORD
        sync: false
